services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: meeting_room
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: meeting_room
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  db_data: